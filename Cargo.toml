[package]
name = "tiered-snapshots"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Kubernetes CronJob that takes CSI VolumeSnapshots and prunes them with tiered retention"
license = "Apache-2.0"
repository = "https://github.com/colaH16/tiered-snapshots"
keywords = ["kubernetes", "volumesnapshot", "csi", "backup", "retention"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
chrono-tz = "0.10.4"
k8s-openapi = { version = "0.29.0", features = ["latest"] }
kube = { version = "5.0.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
