name: Check and publish image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: fmt + clippy + unit tests (in the build image)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: check
          push: false
          cache-from: type=gha,scope=tiered-snapshots
          cache-to: type=gha,mode=max,scope=tiered-snapshots

  publish:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # No QEMU: the Dockerfile cross-compiles arm64 on the runner's arch.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          image=ghcr.io/colah16/tiered-snapshots
          tags="$image:sha-$SHA"
          if [ "$REF_TYPE" = tag ]; then tags="$tags,$image:$REF_NAME"; fi
          if [ "$REF_NAME" = main ]; then tags="$tags,$image:main"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: REVISION=${{ github.sha }}
          provenance: mode=min
          sbom: true
          cache-from: type=gha,scope=tiered-snapshots
          cache-to: type=gha,mode=max,scope=tiered-snapshots
      - name: Record digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/colah16/tiered-snapshots@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
